<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Explorador de Perros</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- SweetAlert2 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Explorador de Perros</h1>

  <div class="container mb-4">
    <select id="selectorRaza" class="form-select mb-2" placeholder="Escribí para buscar...">
      <option selected disabled>Selecciona una raza...</option>
    </select>
    <button id="volverBtn" class="btn btn-secondary">Volver</button>
  </div>

  <div id="contenedor" class="row justify-content-center"></div>

  <script>
    const contenedor = document.getElementById('contenedor');
    const selector = document.getElementById('selectorRaza');
    const volverBtn = document.getElementById('volverBtn');

    let razasGlobal = [];

    // Mostrar todas las razas como tarjetas
    function mostrarTodasLasRazas() {
      contenedor.innerHTML = '';
      volverBtn.style.display = 'none';

      razasGlobal.forEach(raza => {
        fetch(`https://dog.ceo/api/breed/${raza}/images/random`)
          .then(res => res.json())
          .then(imgData => {
            const col = document.createElement('div');
            col.className = 'col-md-4 col-lg-3 mb-4';
            col.innerHTML = `
              <div class="card shadow-sm">
                <img src="${imgData.message}" class="card-img-top" alt="${raza}">
                <div class="card-body text-center">
                  <h5 class="card-title text-capitalize">${raza}</h5>
                  <button class="btn btn-primary btn-sm" onclick="mostrarFotos('${raza}')">Ver más fotos</button>
                </div>
              </div>`;
            contenedor.appendChild(col);
          });
      });
    }

    // Cargar razas en el selector
    fetch('https://dog.ceo/api/breeds/list/all')
      .then(response => response.json())
      .then(data => {
        razasGlobal = Object.keys(data.message);
        razasGlobal.forEach(raza => {
          const option = document.createElement('option');
          option.value = raza;
          option.textContent = raza.charAt(0).toUpperCase() + raza.slice(1);
          selector.appendChild(option);
        });
        mostrarTodasLasRazas();
      });

    // Mostrar 3 fotos en un popup
    function mostrarFotos(raza) {
      fetch(`https://dog.ceo/api/breed/${raza}/images/random/10`)
        .then(response => response.json())
        .then(data => {
          Swal.fire({
            title: `Fotos de ${raza}`,
            html: data.message.map(img => `<img src="${img}" width="100%" style="margin-bottom:10px">`).join(""),
            width: 600,
            confirmButtonText: 'Cerrar'
          });
        });
    }

    // Al seleccionar una raza del combo
    selector.addEventListener('change', () => {
      const raza = selector.value;
      contenedor.innerHTML = '';
      volverBtn.style.display = 'inline-block';

      fetch(`https://dog.ceo/api/breed/${raza}/images/random/10`)
        .then(response => response.json())
        .then(data => {
          data.message.forEach(img => {
            const col = document.createElement('div');
            col.className = 'col-md-4 col-lg-3 mb-4';
            col.innerHTML = `
              <div class="card shadow-sm">
                <img src="${img}" class="card-img-top" alt="${raza}">
                <div class="card-body text-center">
                  <h5 class="card-title text-capitalize">${raza}</h5>
                </div>
              </div>`;
            contenedor.appendChild(col);
          });
        });
    });

    // Botón volver a inicio
    volverBtn.addEventListener('click', () => {
      selector.value = '';
      mostrarTodasLasRazas();
    });
  </script>
</body>
</html>
